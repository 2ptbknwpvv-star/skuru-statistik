<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skuru IK Handbollsstatistik</title>
    <!-- Laddar in säkert Excel-bibliotek direkt i webbläsaren -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background-color: #f4f6f9; color: #333; }
        h1 { color: #004b87; text-align: center; }
        .box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-radius; font-family: monospace; resize: vertical; }
        select, button { padding: 12px 20px; margin-top: 15px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; }
        button { background-color: #008cba; color: white; border: none; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #005f7b; }
        .status { margin-top: 15px; font-weight: bold; text-align: center; color: green; }
    </style>
</head>
<body>

    <h1>Skuru IK - Matchdatakonverterare</h1>
    
    <div class="box">
        <h3>1. Välj vilket lag matchen tillhör:</h3>
        <select id="teamSelect">
            <option value="Skuru IK 4">Skuru IK 4</option>
            <option value="Skuru IK 2">Skuru IK 2</option>
            <option value="Skuru IK 1">Skuru IK 1</option>
        </select>
    </div>

    <div class="box">
        <h3>2. Klistra in rådata från Profixio:</h3>
        <p style="font-size: 13px; color: #666;">Gå till matchens protokoll på Profixio, tryck <strong>Ctrl+A</strong> (markera allt), kopiera och klistra in här under:</p>
        <textarea id="rawData" placeholder="Klistra in texten här..."></textarea>
        <button onclick="processAndDownload()">Konvertera & Ladda ner Excel</button>
        <div id="statusMessage" class="status"></div>
    </div>

    <script>
        function processAndDownload() {
            const team = document.getElementById("teamSelect").value;
            const text = document.getElementById("rawData").value;
            const status = document.getElementById("statusMessage");

            if (!text.trim()) {
                alert("Klistra in lite text först!");
                return;
            }

            const lines = text.split("\n");
            let players = [];

            lines.forEach(line => {
                line = line.trim();
                if (line.length < 5) return;

                // Letar efter rader som slutar med en siffra (mål) eller innehåller namn
                // Fångar upp strukturer som "9 Anna Andersson 4" eller "Elin Östlund 2"
                let match = line.match(/(?:\d+\s+)?([A-ZÅÄÖa-zåäö][-A-ZÅÄÖa-zåäö\s]+?)\s+(\d+)\s*$/);
                if (match) {
                    let name = match[1].trim();
                    let goals = parseInt(match[2]);

                    // Sortera bort systemord
                    if (["Matchinfo", "Resultat", "Domare", "Ledare", "Spelare", "Mål", "Lag", "Period", "Slutresultat", "Hemma", "Borta"].includes(name) || name.length < 4) return;

                    // Kolla om spelaren fick utvisning på samma rad
                    let p2 = (line.includes("2'") || line.includes("2-min") || line.includes("Utvisning")) ? 1 : 0;

                    players.push({
                        "Spelarnamn": name,
                        "Matcher": 1,
                        "Mål": goals,
                        "Utvisningar": p2
                    });
                }
            });

            if (players.length === 0) {
                alert("Kunde inte hitta några spelare eller mål i texten. Kontrollera att du kopierade hela matchsidan.");
                return;
            }

            // Bygg Excel-struktur i minnet
            const worksheet = XLSX.utils.json_to_sheet(players);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, team.substring(0, 31));

            // Skapa filnamn med dagens datum
            const dateStr = new Date().toISOString().split('T')[0];
            const filename = `Statistik_${team.replace(/\s+/g, '_')}_${dateStr}.xlsx`;

            // Trigga direkt nedladdning till din hårddisk
            XLSX.writeFile(workbook, filename);
            status.innerText = `Klart! Excel-filen för ${team} har laddats ner till din dator.`;
            document.getElementById("rawData").value = "";
        }
    </script>
</body>
</html>
