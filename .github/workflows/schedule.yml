name: Automatisk Handbollsskrapning

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # Krävs för att tillåtas uppdatera hemsidan
      id-token: write   # Krävs för modern publicering via GitHub Actions
    steps:
    - name: Hämtar kod
      uses: actions/checkout@v4

    - name: Startar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installerar verktyg
      run: |
        pip install pandas openpyxl

    - name: Kör API-skrapningen och uppdatera HTML
      run: python scraper.py

    - name: Spara ändringarna i kodarkivet (Commit & Push)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff-index --quiet HEAD || (git commit -m "Automatisk statistikuppdatering" && git push)

    - name: Paketera den nya hemsidan
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Publicera hemsidan live på nätet
      uses: actions/deploy-pages@v4
