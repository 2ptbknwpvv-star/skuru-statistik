name: Automatisk Handbollsskrapning

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ger molndatorn rättighet att spara filer i ditt projekt!
    steps:
    - name: Hämtar kod
      uses: actions/checkout@v4

    - name: Startar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installerar Playwright och verktyg
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Kör skrapningen och uppdatera HTML
      run: python scraper.py

    - name: Spara och tryck upp ändringarna till GitHub
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Automatisk statistikuppdatering"
        git push
