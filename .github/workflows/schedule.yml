name: Automatisk Handbollsskrapning

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # Lägger till rättighet att skriva till hemsidan
      id-token: write   # Krävs för att verifiera publiceringen
    steps:
    - name: Hämtar kod
      uses: actions/checkout@v4

    - name: Startar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installerar Playwright och verktyg
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Kör skrapningen och uppdatera HTML
      run: python scraper.py

    - name: Konfigurera och ladda upp hemsidan direkt
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Publicera hemsidan live
      uses: actions/deploy-pages@v4
