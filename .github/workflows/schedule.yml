name: Automatisk Handbollsskrapning

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # Ger rättighet att uppdatera hemsidan live
      id-token: write   # Krävs för modern publicering
    steps:
    - name: Hämtar kod
      uses: actions/checkout@v4

    - name: Startar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installerar Playwright och verktyg
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Kör skrapningen och uppdatera HTML
      run: python scraper.py

    - name: Paketera hemsidan för publicering
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Publicera hemsidan live på nätet
      uses: actions/deploy-pages@v4
