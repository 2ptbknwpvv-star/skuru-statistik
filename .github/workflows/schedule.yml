name: Automatisk Handbollsskrapning

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      
      id-token: write   
    steps:
    - name: Hämtar kod
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Hämtar hela historiken så att vi kan spara ändringar

    - name: Startar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installerar Playwright och verktyg
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Kör skrapningen och uppdatera HTML
      run: python scraper.py

    - name: Spara ändringarna i kodarkivet (Commit & Push)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        # Sparar bara om filen faktiskt har ändrats (dvs. ny data hittades)
        git diff-index --quiet HEAD || (git commit -m "Automatisk statistikuppdatering" && git push)

    - name: Konfigurera och ladda upp hemsidan direkt
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Publicera hemsidan live
      uses: actions/deploy-pages@v4
