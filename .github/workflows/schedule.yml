name: Automatisk Handbollsskrapning

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Hämtar kod
      uses: actions/checkout@v4

    - name: Startar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installerar Playwright och Excel-verktyg
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Kör skrapningen av Profixio
      run: python scraper.py

    - name: Spara Excel-filen i molnet
      uses: actions/upload-artifact@v4
      with:
        name: Handbollsstatistik-Skuru
        path: profixio_handbollsstatistik_auto.xlsx
