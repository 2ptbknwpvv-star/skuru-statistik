name: Automatisk Handbollsskrapning

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Krävs för att kunna spara i ditt kodarkiv
    steps:
    - name: Hämtar kod
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Startar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installerar Playwright och verktyg
      run: |
        pip install playwright pandas openpyxl
        playwright install chromium

    - name: Kör skrapningen och uppdatera HTML
      run: python scraper.py

    - name: Spara ändringarna i kodarkivet (Commit & Push)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git diff-index --quiet HEAD || (git commit -m "Automatisk statistikuppdatering" && git push)
